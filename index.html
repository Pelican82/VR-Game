<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body>
  <a-scene>

    <!-- CAMERA (mouse look re‑enabled) -->
    <a-entity id="player" position="0 1.6 0">
      <a-camera id="camera" look-controls="enabled: true"></a-camera>
    </a-entity>

    <!-- FLOOR -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#8B4513"></a-plane>

    <!-- SKY -->
    <a-sky color="#CCEEFF"></a-sky>

    <!-- SUN -->
    <a-sphere position="-5 10 -10" radius="2" color="yellow"></a-sphere>

    <!-- FRONT WALL (windows) -->
    <a-plane position="0 2 -10" rotation="0 0 0" width="20" height="4" color="#222"></a-plane>
    <a-plane position="-6 2 -10" rotation="0 0 0" width="3" height="2" color="#88CCFF" opacity="0.6"></a-plane>
    <a-plane position="6 2 -10" rotation="0 0 0" width="3" height="2" color="#88CCFF" opacity="0.6"></a-plane>

    <!-- BACK WALL (door) -->
    <a-plane position="0 2 10" rotation="0 180 0" width="20" height="4" color="#222"></a-plane>
    <a-plane position="0 1 10" rotation="0 180 0" width="2" height="3" color="#654321"></a-plane>

    <!-- LEFT WALL -->
    <a-plane position="-10 2 0" rotation="0 90 0" width="20" height="4" color="#222"></a-plane>

    <!-- RIGHT WALL -->
    <a-plane position="10 2 0" rotation="0 -90 0" width="20" height="4" color="#222"></a-plane>

    <!-- SIDE WINDOWS -->
    <a-plane position="-10 2 -4" rotation="0 90 0" width="3" height="2" color="#88CCFF" opacity="0.6"></a-plane>
    <a-plane position="10 2 4" rotation="0 -90 0" width="3" height="2" color="#88CCFF" opacity="0.6"></a-plane>

    <!-- ROOF -->
    <a-box position="0 4 0" width="20" height="0.2" depth="20" color="#444"></a-box>

  </a-scene>

  <script>
    const player = document.querySelector('#player');
    let yRotation = 0;
    let isJumping = false;

    document.addEventListener('keydown', (e) => {
      if (e.key === "ArrowLeft") yRotation += 5;
      if (e.key === "ArrowRight") yRotation -= 5;
      if (e.key === "q" || e.key === "Q") player.object3D.position.y += 0.2;
      if (e.key === "e" || e.key === "E") player.object3D.position.y -= 0.2;

      if (e.code === "Space" && !isJumping) {
        isJumping = true;
        let startY = player.object3D.position.y;
        player.object3D.position.y = startY + 1;
        setTimeout(() => {
          player.object3D.position.y = startY;
          isJumping = false;
        }, 400);
      }

      player.object3D.rotation.y = THREE.Math.degToRad(yRotation);
    });
  </script>

</body>
</html>
