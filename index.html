<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body>
  <a-scene>

    <!-- CAMERA -->
    <a-entity id="player" position="0 1.6 0">
      <a-camera look-controls="enabled: true"></a-camera>
    </a-entity>

    <!-- FLOOR -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#8B4513"></a-plane>

    <!-- SKY -->
    <a-sky color="#CCEEFF"></a-sky>

    <!-- FRONT WALL (3D brick) -->
    <a-box position="0 3 -10" width="20" height="6" depth="1"
           material="src: https://threejs.org/examples/textures/brick_diffuse.jpg; repeat: 10 3"></a-box>

    <!-- WOOD DOOR -->
    <a-box position="0 1.3 -9.35" width="1.5" height="2.6" depth="0.2"
           material="src: https://threejs.org/examples/textures/hardwood2_diffuse.jpg; repeat: 1 2"></a-box>

    <!-- DOOR KNOB -->
    <a-sphere position="0.55 1.3 -9.2" radius="0.06" color="#D4AF37" metalness="0.8" roughness="0.2"></a-sphere>

    <!-- FRONT WINDOWS -->
    <a-box position="-6 3 -9.4" width="3" height="2" depth="0.2"
           color="#88CCFF" opacity="0.6"></a-box>
    <a-box position="6 3 -9.4" width="3" height="2" depth="0.2"
           color="#88CCFF" opacity="0.6"></a-box>

    <!-- BACK WALL -->
    <a-box position="0 3 10" width="20" height="6" depth="1"
           material="src: https://threejs.org/examples/textures/brick_diffuse.jpg; repeat: 10 3"></a-box>

    <!-- LEFT WALL -->
    <a-box position="-10 3 0" width="1" height="6" depth="20"
           material="src: https://threejs.org/examples/textures/brick_diffuse.jpg; repeat: 10 3"></a-box>

    <!-- RIGHT WALL -->
    <a-box position="10 3 0" width="1" height="6" depth="20"
           material="src: https://threejs.org/examples/textures/brick_diffuse.jpg; repeat: 10 3"></a-box>

    <!-- ROOF -->
    <a-box position="0 6.1 0" width="20" height="0.5" depth="20" color="#444"></a-box>

  </a-scene>

  <script>
    const player = document.querySelector('#player');
    let yRotation = 0;
    let isJumping = false;

    document.addEventListener('keydown', (e) => {

      if (e.key === "ArrowLeft") yRotation += 5;
      if (e.key === "ArrowRight") yRotation -= 5;

      if (e.key === "q" || e.key === "Q") player.object3D.position.y += 0.2;
      if (e.key === "e" || e.key === "E") player.object3D.position.y -= 0.2;

      if (e.code === "Space" && !isJumping) {
        isJumping = true;
        let startY = player.object3D.position.y;
        player.object3D.position.y = startY + 1;
        setTimeout(() => {
          player.object3D.position.y = startY;
          isJumping = false;
        }, 400);
      }

      player.object3D.rotation.y = THREE.Math.degToRad(yRotation);

      const x = player.object3D.position.x;
      const z = player.object3D.position.z;

      // Keep player from clipping into the side walls (walls sit at x = ±10)
      if (x > 9.3) player.object3D.position.x = 9.3;
      if (x < -9.3) player.object3D.position.x = -9.3;

      // Keep player from clipping into the front door (door front face is at z = -9.25)
      if (z > 9.3) player.object3D.position.z = 9.3;
      if (z < -9.1) player.object3D.position.z = -9.1;
    });
  </script>

</body>
</html>
