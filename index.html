<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body>
  <a-scene>

    <!-- CAMERA WITH CUSTOM CONTROLS -->
    <a-entity id="player" position="0 1.6 0">
      <a-camera id="camera"></a-camera>
    </a-entity>

    <!-- RED BOX -->
    <a-box position="-1 1 -3" color="red"></a-box>

    <!-- BLUE SPHERE -->
    <a-sphere position="1 1 -4" color="blue"></a-sphere>

    <!-- GREEN GROUND -->
    <a-plane
      position="0 0 -4"
      rotation="-90 0 0"
      width="20"
      height="20"
      color="#55AA55">
    </a-plane>

    <!-- SKY -->
    <a-sky color="#CCEEFF"></a-sky>

    <!-- SUN -->
    <a-sphere 
      position="-5 10 -10" 
      radius="2" 
      color="yellow">
    </a-sphere>

  </a-scene>

  <script>
    const player = document.querySelector('#player');
    let yRotation = 0;
    let xRotation = 0;
    let isJumping = false;

    document.addEventListener('keydown', (e) => {
      // LEFT / RIGHT → rotate camera on Y axis
      if (e.key === "ArrowLeft") {
        yRotation += 5;
      }
      if (e.key === "ArrowRight") {
        yRotation -= 5;
      }

      // UP / DOWN → rotate camera on X axis
      if (e.key === "ArrowUp") {
        xRotation += 5;
      }
      if (e.key === "ArrowDown") {
        xRotation -= 5;
      }

      // SPACEBAR → jump
      if (e.code === "Space" && !isJumping) {
        isJumping = true;

        let startY = player.object3D.position.y;

        // Jump up
        player.object3D.position.y = startY + 1;

        // Fall back down after 400ms
        setTimeout(() => {
          player.object3D.position.y = startY;
          isJumping = false;
        }, 400);
      }

      // Apply rotation
      player.object3D.rotation.y = THREE.Math.degToRad(yRotation);
      player.object3D.rotation.x = THREE.Math.degToRad(xRotation);
    });
  </script>

</body>
</html>
