<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body>
  <a-scene>

    <!-- CAMERA RIG: default A-Frame movement. wasd-controls on the OUTER entity moves you
         around (WASD + arrow keys by default), look-controls on the INNER camera handles
         mouse-look. This is A-Frame's standard rig pattern. -->
    <a-entity id="player" position="0 1.6 0" wasd-controls="acceleration: 20">
      <a-camera id="cam" look-controls></a-camera>
    </a-entity>

    <!-- FLOOR -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#8B4513"></a-plane>

    <!-- SKY -->
    <a-sky color="#CCEEFF"></a-sky>

    <!-- FRONT WALL (split around the entrance doorway at x -0.75 to 0.75) -->
    <a-box position="-5.375 3 -10" width="9.25" height="6" depth="1"
           material="src: https://threejs.org/examples/textures/brick_diffuse.jpg; repeat: 5 3"></a-box>
    <a-box position="5.375 3 -10" width="9.25" height="6" depth="1"
           material="src: https://threejs.org/examples/textures/brick_diffuse.jpg; repeat: 5 3"></a-box>

    <!-- BACK WALL -->
    <a-box position="0 3 10" width="20" height="6" depth="1"
           material="src: https://threejs.org/examples/textures/brick_diffuse.jpg; repeat: 10 3"></a-box>

    <!-- LEFT WALL -->
    <a-box position="-10 3 0" width="1" height="6" depth="20"
           material="src: https://threejs.org/examples/textures/brick_diffuse.jpg; repeat: 10 3"></a-box>

    <!-- RIGHT WALL -->
    <a-box position="10 3 0" width="1" height="6" depth="20"
           material="src: https://threejs.org/examples/textures/brick_diffuse.jpg; repeat: 10 3"></a-box>

    <!-- ROOF -->
    <a-box position="0 6.1 0" width="20" height="0.5" depth="20" color="#444"></a-box>

    <!-- BRICK HEADER (fills the gap above the door, up to the roof, with generous overlap
         onto the side wall pieces so there's no sliver of sky visible) -->
    <a-box position="0 4.3 -10" width="1.9" height="3.4" depth="1.02"
           material="src: https://threejs.org/examples/textures/brick_diffuse.jpg; repeat: 1 2"></a-box>

    <!-- ENTRANCE DOOR (flush with the wall's outer face at z=-9.5, fully covering the gap) -->
    <a-box position="0 1.3 -9.575" width="1.9" height="2.6" depth="0.15"
           material="src: https://threejs.org/examples/textures/hardwood2_diffuse.jpg; repeat: 1 2"></a-box>
    <a-sphere position="0.7 1.3 -9.48" radius="0.06" color="#D4AF37" metalness="0.8" roughness="0.2"></a-sphere>

    <!-- FRONT WINDOWS -->
    <a-box position="-6 3.5 -9.55" width="1.8" height="1.8" depth="0.1" color="#88CCFF" opacity="0.5" side="double"></a-box>
    <a-box position="-6 3.5 -9.6" width="2" height="2" depth="0.05" color="#5C3A21"></a-box>
    <a-box position="6 3.5 -9.55" width="1.8" height="1.8" depth="0.1" color="#88CCFF" opacity="0.5" side="double"></a-box>
    <a-box position="6 3.5 -9.6" width="2" height="2" depth="0.05" color="#5C3A21"></a-box>

  </a-scene>

  <script>
    const player = document.querySelector('#player');

    // Only custom keyboard behavior kept: Q/E move the player up/down.
    document.addEventListener('keydown', (e) => {
      if (e.key === "q" || e.key === "Q") player.object3D.position.y += 0.2;
      if (e.key === "e" || e.key === "E") player.object3D.position.y -= 0.2;
    });

    // ---- SOLID EXTERIOR WALLS (circle vs. axis-aligned box collision) ----
    // This runs every frame regardless of what moved the player (default
    // wasd-controls, in this case) and simply pushes you back out if you
    // end up inside a wall.
    const wallBoxes = [
      { xMin: -10.5, xMax: -0.75, zMin: -10.5, zMax: -9.5 }, // front-left of doorway
      { xMin: 0.75, xMax: 10.5, zMin: -10.5, zMax: -9.5 },   // front-right of doorway
      { xMin: -10, xMax: 10, zMin: 9.5, zMax: 10.5 },        // back
      { xMin: -10.5, xMax: -9.5, zMin: -10, zMax: 10 },      // left
      { xMin: 9.5, xMax: 10.5, zMin: -10, zMax: 10 },        // right
    ];

    const PLAYER_RADIUS = 0.35;
    const MAX_STEP = 0.2; // max distance the player can move in a single frame

    // Floor sits at y=0, roof's underside sits at y=5.85 (roof box is 0.5 tall,
    // centered at y=6.1). Keep the camera's eye position between the two,
    // with a little headroom so you don't clip into either.
    const FLOOR_Y = 0.15;
    const ROOF_Y = 5.7;

    // Track the last known-good position so we can cap how far we move
    // in one frame — this stops fast movement from "jumping over" a wall
    // before the collision check ever sees it.
    let prevX = player.object3D.position.x;
    let prevZ = player.object3D.position.z;

    function collisionLoop() {
      const pos = player.object3D.position;

      // Cap the distance moved this frame so we can never tunnel through a wall
      let deltaX = pos.x - prevX;
      let deltaZ = pos.z - prevZ;
      const stepDist = Math.hypot(deltaX, deltaZ);
      if (stepDist > MAX_STEP) {
        const scale = MAX_STEP / stepDist;
        deltaX *= scale;
        deltaZ *= scale;
      }

      let newX = prevX + deltaX;
      let newZ = prevZ + deltaZ;

      for (const w of wallBoxes) {
        const closestX = Math.max(w.xMin, Math.min(newX, w.xMax));
        const closestZ = Math.max(w.zMin, Math.min(newZ, w.zMax));
        const dx = newX - closestX;
        const dz = newZ - closestZ;
        const distSq = dx * dx + dz * dz;

        if (distSq < PLAYER_RADIUS * PLAYER_RADIUS) {
          const dist = Math.sqrt(distSq) || 0.0001;
          const overlap = PLAYER_RADIUS - dist;
          newX += (dx / dist) * overlap;
          newZ += (dz / dist) * overlap;
        }
      }

      pos.x = newX;
      pos.z = newZ;
      prevX = newX;
      prevZ = newZ;

      // Floor and roof collision (blocks Q/E flying through either)
      if (pos.y < FLOOR_Y) pos.y = FLOOR_Y;
      if (pos.y > ROOF_Y) pos.y = ROOF_Y;

      requestAnimationFrame(collisionLoop);
    }

    requestAnimationFrame(collisionLoop);
  </script>

</body>
</html>
